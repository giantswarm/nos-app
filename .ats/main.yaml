# app-test-suite (ats >= 1.0) config for the generated execute-chart-tests CircleCI job.
# ats creates a kind cluster, applies the CRDs below, installs the packaged chart with
# `helm upgrade --install --wait` and runs `uv run pytest -m smoke` in tests/ats.
#
# The smoke installs the scheduler and the GPU partitioner; the operator stays off because
# the kind cluster has no cert-manager for its webhook certificate (tests/ats/smoke-values.yaml).
# The MIG/MPS agent DaemonSets select GPU nodes and schedule nothing on kind.
app-tests-deploy-namespace: nos-system
app-tests-app-config-file: tests/ats/smoke-values.yaml

# The scheduler's CapacityScheduling plugin blocks until its ElasticQuota and
# CompositeElasticQuota informers sync, and the chart ships those CRDs under
# templates/operator (gated on operator.enabled). With the operator off they come from
# upstream (same nos release as appVersion), appended to the ats bundle (/etc/ats/crds).
cluster-crds: /etc/ats/crds,https://raw.githubusercontent.com/nebuly-ai/nos/0.1.2/config/operator/crd/bases/nos.nebuly.com_elasticquotas.yaml,https://raw.githubusercontent.com/nebuly-ai/nos/0.1.2/config/operator/crd/bases/nos.nebuly.com_compositeelasticquotas.yaml

# functional: no functional tests yet.
# upgrade: needs upgrade-tests-app-catalog-url pointing at the released chart; not wired.
skip-steps: [functional, upgrade]
